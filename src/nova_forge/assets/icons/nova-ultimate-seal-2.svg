<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 圆形金属外框渐变 -->
    <linearGradient id="circleMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="30%" stop-color="#D5D9E0"/>
      <stop offset="60%" stop-color="#8E94A0"/>
      <stop offset="100%" stop-color="#3A414D"/>
    </linearGradient>

    <!-- 内圈暗边 -->
    <linearGradient id="innerEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7d8491"/>
      <stop offset="100%" stop-color="#2c323d"/>
    </linearGradient>

    <!-- 蓝色北极星芒渐变 -->
    <linearGradient id="starBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6F5FF"/>
      <stop offset="30%" stop-color="#67E0F5"/>
      <stop offset="70%" stop-color="#217FD1"/>
      <stop offset="100%" stop-color="#0B2F70"/>
    </linearGradient>

    <!-- 金色斜垫片渐变 -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE55C"/>
      <stop offset="50%" stop-color="#D4A214"/>
      <stop offset="100%" stop-color="#8A6500"/>
    </linearGradient>

    <!-- 中心青光核 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#35E0D8"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- 青色发光 -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 金色发光 -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 金属边框阴影 -->
    <filter id="bevelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 深色背景 -->
  <rect width="512" height="512" fill="#0F1420" rx="14"/>

  <!-- 圆形金属外框 -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#circleMetal)" stroke-width="14" filter="url(#bevelShadow)"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#innerEdge)" stroke-width="3"/>
  <circle cx="256" cy="256" r="196" fill="#101521"/>

  <!-- 轨道系统 -->
  <g transform="translate(256,224)">
    <!-- 金色实线轨道 -->
    <ellipse cx="0" cy="0" rx="132" ry="56" fill="none" stroke="url(#starGold)" stroke-width="2" opacity="0.75" filter="url(#glowGold)"/>
    <!-- 青色虚线轨道 1 -->
    <ellipse cx="0" cy="0" rx="132" ry="56" fill="none" stroke="#35E0D8" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.85" filter="url(#glowCyan)" transform="rotate(60)"/>
    <!-- 青色虚线轨道 2 -->
    <ellipse cx="0" cy="0" rx="132" ry="56" fill="none" stroke="#35E0D8" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.85" filter="url(#glowCyan)" transform="rotate(-60)"/>
    <!-- 轨道端点光点 -->
    <circle cx="132" cy="0" r="3" fill="#35E0D8" filter="url(#glowCyan)"/>
    <circle cx="-132" cy="0" r="3" fill="#35E0D8" filter="url(#glowCyan)"/>
  </g>

  <!-- 北极星主体：蓝色四向长尖 -->
  <g transform="translate(256,224)">
    <polygon points="0,-94 20,-24 0,2 -20,-24" fill="url(#starBlue)" stroke="#FFFFFF" stroke-width="1"/>
    <polygon points="0,94 20,24 0,-2 -20,24" fill="url(#starBlue)" stroke="#FFFFFF" stroke-width="1"/>
    <polygon points="-94,0 -24,-20 -2,0 -24,20" fill="url(#starBlue)" stroke="#FFFFFF" stroke-width="1"/>
    <polygon points="94,0 24,20 2,0 24,-20" fill="url(#starBlue)" stroke="#FFFFFF" stroke-width="1"/>

    <!-- 金色斜向三角垫片 -->
    <polygon points="20,-24 62,-62 24,-20" fill="url(#starGold)" stroke="#FFFFFF" stroke-width="0.9"/>
    <polygon points="20,24 62,62 24,20" fill="url(#starGold)" stroke="#FFFFFF" stroke-width="0.9"/>
    <polygon points="-20,24 -62,62 -24,20" fill="url(#starGold)" stroke="#FFFFFF" stroke-width="0.9"/>
    <polygon points="-20,-24 -62,-62 -24,-20" fill="url(#starGold)" stroke="#FFFFFF" stroke-width="0.9"/>

    <!-- 中心青光核 -->
    <circle cx="0" cy="0" r="26" fill="url(#coreGlow)"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
  </g>

  <!-- 底部小圆环 -->
  <g transform="translate(256,370)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#starGold)" stroke-width="1.6" opacity="0.7"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#35E0D8" stroke-width="1.4" opacity="0.85" filter="url(#glowCyan)"/>
    <circle cx="0" cy="-34" r="2" fill="#FFE55C"/>
    <circle cx="34" cy="0" r="2" fill="#FFE55C"/>
    <circle cx="0" cy="34" r="2" fill="#FFE55C"/>
    <circle cx="-34" cy="0" r="2" fill="#FFE55C"/>
  </g>
</svg>