<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 拉丝金属渐变 -->
    <linearGradient id="brushedMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="25%" stop-color="#D1D5DB"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="75%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>

    <!-- 鎏金渐变 -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#FFF8DC"/>
    </linearGradient>

    <!-- 离子青发光 -->
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35E0C8" stop-opacity="1"/>
      <stop offset="60%" stop-color="#1DD6C3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0"/>
    </radialGradient>

    <!-- 星核 3D 切面渐变 -->
    <linearGradient id="starFace1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="starFace2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- 用于模拟 QML 中动感的拖尾滤镜 (注意 Qt 支持度，此处用简单模糊) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. 背景与六边形底座 (立体化) -->
  <rect width="512" height="512" fill="#0A0E17" rx="40"/>

  <!-- 六边形拉丝铝底座 -->
  <polygon points="256,36 448,128 448,384 256,476 64,384 64,128"
           fill="url(#brushedMetal)" stroke="#1F2937" stroke-width="4"/>
  <!-- 底座内阴影与倒角 -->
  <polygon points="256,56 428,140 428,372 256,456 84,372 84,140"
           fill="#0A0E17" stroke="#9CA3AF" stroke-width="2"/>

  <!-- 2. 轨道系统 (动感/立体) -->
  <!-- 轨道 1：深色轨道带鎏金边 -->
  <g transform="translate(256, 256) rotate(-30)">
    <ellipse cx="0" cy="0" rx="180" ry="70" fill="none" stroke="url(#goldGradient)" stroke-width="12" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="180" ry="70" fill="none" stroke="#0A0E17" stroke-width="6"/>
    <!-- 轨道光点 (动感电子) -->
    <circle cx="180" cy="0" r="8" fill="#35E0C8" filter="url(#glow)"/>
    <circle cx="-180" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- 轨道 2：交叉轨道 -->
  <g transform="translate(256, 256) rotate(45)">
    <ellipse cx="0" cy="0" rx="70" ry="180" fill="none" stroke="#1DD6C3" stroke-width="4" opacity="0.5" stroke-dasharray="20 10"/>
    <!-- 轨道光流 -->
    <circle cx="0" cy="-180" r="6" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- 3. 旗舰星核 (3D 晶体切割) -->
  <g transform="translate(256, 256)">
    <!-- 发光底背 -->
    <circle cx="0" cy="0" r="60" fill="url(#auroraGlow)" filter="url(#glow)"/>

    <!-- 3D 切割面 -->
    <!-- 左侧面 -->
    <polygon points="0,-80 -50,0 0,20" fill="url(#starFace1)" stroke="#FFFFFF" stroke-width="1" opacity="0.9"/>
    <!-- 右侧面 -->
    <polygon points="0,-80 50,0 0,20" fill="url(#starFace2)" stroke="#FFFFFF" stroke-width="1" opacity="0.9"/>
    <!-- 下侧面 -->
    <polygon points="-50,0 0,20 50,0 0,80" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="1"/>
    <!-- 核心高光 -->
    <polygon points="0,-40 -20,0 0,10 20,0" fill="#35E0C8" filter="url(#glow)"/>

    <!-- 4. 8 条电路射线 (45度拐弯) -->
    <g stroke="#1DD6C3" stroke-width="2" fill="none" opacity="0.8">
      <path d="M 0,-90 L 0,-110 L 15,-125" />
      <path d="M 90,0 L 110,0 L 125,-15" />
      <path d="M 0,90 L 0,110 L -15,125" />
      <path d="M -90,0 L -110,0 L -125,15" />
      <path d="M 60,-60 L 75,-75 L 75,-90" />
      <path d="M 60,60 L 75,75 L 90,75" />
      <path d="M -60,60 L -75,75 L -75,90" />
      <path d="M -60,-60 L -75,-75 L -90,-75" />
    </g>
    <!-- 射线末端发光节点 -->
    <g fill="#35E0C8" filter="url(#glow)">
      <circle cx="15" cy="-125" r="3"/>
      <circle cx="125" cy="-15" r="3"/>
      <circle cx="-15" cy="125" r="3"/>
      <circle cx="-125" cy="15" r="3"/>
      <circle cx="75" cy="-90" r="3"/>
      <circle cx="90" cy="75" r="3"/>
      <circle cx="-75" cy="90" r="3"/>
      <circle cx="-90" cy="-75" r="3"/>
    </g>
  </g>

  <!-- 5. 弧铭文 -->
  <path id="textArcTop" d="M 100,256 A 156,156 0 0,1 412,256" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="18" fill="#D1D5DB" letter-spacing="4" font-weight="bold">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">PYSIDE · NOVA ULTIMATE</textPath>
  </text>

  <path id="textArcBottom" d="M 96,256 A 160,160 0 0,0 416,256" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="14" fill="#6B7280" letter-spacing="3">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">ALUMINUM × COMPUTING × MOBILE</textPath>
  </text>

  <!-- 6. 小诺的彩蛋：青色的问号 (藏在底座下方拉丝纹理中) -->
  <g transform="translate(256, 420) scale(0.6)" fill="none" stroke="#35E0C8" stroke-width="4" opacity="0.6">
    <path d="M -10,-10 Q -10,-20 0,-20 Q 10,-20 10,-10 Q 10,0 0,5 L 0,10" />
    <circle cx="0" cy="20" r="3" fill="#35E0C8" />
  </g>
</svg>