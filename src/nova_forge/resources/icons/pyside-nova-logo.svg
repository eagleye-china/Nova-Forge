  <rect x="18" y="68" width="42" height="42" rx="10" fill="#0F1E3D"/>
  <rect x="68" y="68" width="42" height="42" rx="10" fill="#0F1E3D"/>

  <!-- 旗舰星芒：占据矩阵右上格 -->
  <path d="M 89 24 L 94.3 43.7 L 114 49 L 94.3 54.3 L 89 74 L 83.7 54.3 L 64 49 L 83.7 43.7 Z"
