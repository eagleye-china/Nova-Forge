  <title>pyside-nova · 企业级旗舰封版徽标</title>
  <desc>环形封印：外环二十刻度对应二十组合根，CARF 四词铭文，六枚青点对应六维天花板，中心为经典组件矩阵与青蓝渐变旗舰星芒，星芯为极光白核。</desc>
