[build-system]
requires = ["setuptools>=68.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-forge"
version = "0.2.0c"
description = "The ultimate project forging tool for PySide6 ecosystems. Scaffold enterprise-grade architectures in seconds."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "eagleye-china", email = "zdt168@sina.cn" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "tomli>=2.0.0; python_version < '3.11'", # ✅ 加这行，完美适配 3.10
]

[project.urls]
Homepage = "https://github.com/eagleye-china/Nova-Forge"
Repository = "https://github.com/eagleye-china/Nova-Forge"
Issues = "https://github.com/eagleye-china/Nova-Forge/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nova_forge*"]

# ✅ 核心：注册全局命令
[project.scripts]
nova-forge = "nova_forge.cli:main"
