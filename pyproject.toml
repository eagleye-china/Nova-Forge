[build-system]
requires = ["setuptools>=68.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-forge"
version = "0.6.0"
description = "The ultimate project forging tool for PySide6 ecosystems. Scaffold enterprise-grade architectures in seconds."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "eagleye-china", email = "zdt168@sina.cn" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "tomli>=2.0.0; python_version < '3.11'", # ✅ 加这行，完美适配 3.10
]

[project.optional-dependencies]
# T23：prescript GUI 英雄卡 README 用 Nova.Controls.NovaMarkdown 渲染 md，
# 该公共类型自 pyside-nova 1.4.0（第 145 类型 / T20）起导出；1.3.0 无此类型，
# 故下限由 1.3.0 校准为 1.4.0（账实相符）。T22 的实现体增强（GFM 表格逐格
# 自绘 / TOC 可滚动 / 锚点去重）属 1.5.0，公共面不变，1.4.0 仍可正常渲染。
gui = ["PySide6>=6.6", "pyside-nova>=1.4.0"]

[project.urls]
Homepage = "https://github.com/eagleye-china/Nova-Forge"
Repository = "https://github.com/eagleye-china/Nova-Forge"
Issues = "https://github.com/eagleye-china/Nova-Forge/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nova_forge*"]

[tool.setuptools.package-data]
nova_forge = ["assets/*.txt", "utils/ui/*.qss", "ui/qml/*.qml",
              "resources/*.qrc", "resources/icons/*.svg"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "E701", "RUF001", "RUF003", "RUF002"]

# QML 桥接对象暴露给 QML 的属性 / 信号 / Slot 必须是 camelCase（QML 侧契约名，
# 改名即断链），N802 / N815 在此类文件上恒成立且不应"修正"。
[tool.ruff.lint.per-file-ignores]
"src/nova_forge/bridge/*_bridge.py" = ["N802", "N815"]

# ✅ 核心:注册全局命令
[project.scripts]
nova-forge = "nova_forge.cli:main"
