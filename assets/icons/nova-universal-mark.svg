<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 拉丝铝外环 -->
    <linearGradient id="aluRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#6d7d92"/>
      <stop offset="15%" stop-color="#eef4fb"/>
      <stop offset="38%" stop-color="#a9bccf"/>
      <stop offset="55%" stop-color="#f6fafd"/>
      <stop offset="72%" stop-color="#8ea1b6"/>
      <stop offset="88%" stop-color="#d5e1ec"/>
      <stop offset="100%" stop-color="#78899d"/>
    </linearGradient>
    <!-- 深蓝渐变底盘（与专用图标一脉相承） -->
    <linearGradient id="deepBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0b2a6b"/>
      <stop offset="48%" stop-color="#1550b8"/>
      <stop offset="100%" stop-color="#2f9cf0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#bfe3ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bfe3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ══ 拉丝铝外环：铝行业基因，无需文字 ══ -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#aluRing)" stroke-width="16" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="231" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <circle cx="256" cy="256" r="241" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="256" r="214" fill="url(#deepBlue)"/>

  <!-- ══ N 字水印（若隐若现）══ -->
  <text x="256" y="300" text-anchor="middle" font-size="180" font-weight="800"
        font-family="Arial, sans-serif" fill="#ffffff" opacity="0.08">N</text>

  <!-- ══ 中心新星（延续专用图标语言）══ -->
  <circle cx="250" cy="252" r="118" fill="url(#sunGlow)"/>
  <circle cx="250" cy="252" r="52" fill="#ffffff" filter="url(#glow)"/>

  <!-- ══ 新星轨道（亦是铝电解电流回路）══ -->
  <g transform="rotate(-20 256 256)">
    <ellipse cx="256" cy="256" rx="188" ry="72" fill="none" stroke="#ffffff"
             stroke-width="4.5" opacity="0.95"/>
  </g>

  <!-- ══ 轨道上的星芒（Nova 爆发点）══ -->
  <!-- 右上主星芒 -->
  <g transform="translate(392,142)" filter="url(#glow)">
    <path d="M 0 -34 Q 5 -5 34 0 Q 5 5 0 34 Q -5 5 -34 0 Q -5 -5 0 -34 Z" fill="#ffffff"/>
  </g>
  <!-- 左下副星芒 -->
  <g transform="translate(118,372)" filter="url(#glow)">
    <path d="M 0 -26 Q 4 -4 26 0 Q 4 4 0 26 Q -4 4 -26 0 Q -4 -4 0 -26 Z" fill="#ffffff"/>
  </g>

  <!-- ══ 轨道电子（电解电流 / 代码流）══ -->
  <circle cx="150" cy="205" r="7" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="368" cy="330" r="6" fill="#ffffff" opacity="0.9"/>

  <!-- ══ 点缀星辰 ══ -->
  <circle cx="330" cy="120" r="4" fill="#ffffff" opacity="0.85"/>
  <circle cx="128" cy="150" r="3.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="396" cy="368" r="3.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="212" cy="428" r="4" fill="#ffffff" opacity="0.8"/>
</svg>
