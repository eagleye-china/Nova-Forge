<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- 鎏金渐变（外环 / 缎带） -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#8a5f1d"/>
      <stop offset="18%" stop-color="#f9e08a"/>
      <stop offset="42%" stop-color="#c9992f"/>
      <stop offset="62%" stop-color="#fff2c0"/>
      <stop offset="85%" stop-color="#9c7222"/>
      <stop offset="100%" stop-color="#d9b45a"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#f7dd8d"/>
      <stop offset="45%" stop-color="#d9a939"/>
      <stop offset="100%" stop-color="#a5761f"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#c9982f"/>
      <stop offset="100%" stop-color="#8a5f1d"/>
    </linearGradient>
    <!-- 深空蓝底盘 -->
    <radialGradient id="navy" cx="50%" cy="38%" r="75%">
      <stop offset="0%"  stop-color="#24406e"/>
      <stop offset="55%" stop-color="#12224a"/>
      <stop offset="100%" stop-color="#070d22"/>
    </radialGradient>
    <!-- 新星本体 -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#f0b13c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f0b13c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f0b13c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <!-- 环形文字路径 -->
    <path id="arcTop" d="M 66 256 A 190 190 0 0 1 446 256" fill="none"/>
    <path id="arcBottom" d="M 84 256 A 172 172 0 0 0 428 256" fill="none"/>
  </defs>

  <!-- ══ 外环与底盘 ══ -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldRing)" stroke-width="16" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="214" fill="url(#navy)"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#f2cf7e" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.4"/>

  <!-- 左右装饰菱形 -->
  <path d="M 52 246 L 60 256 L 52 266 L 44 256 Z" fill="url(#goldRibbon)"/>
  <path d="M 460 246 L 468 256 L 460 266 L 452 256 Z" fill="url(#goldRibbon)"/>

  <!-- ══ N 字水印 ══ -->
  <text x="256" y="272" text-anchor="middle" font-size="190" font-weight="800"
        fill="url(#starGrad)" opacity="0.14">N</text>

  <!-- ══ Nova 星芒 ══ -->
  <g transform="translate(256,210)">
    <circle r="130" fill="url(#halo)"/>
    <!-- 放射线 -->
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.14">
      <line x1="0" y1="-62" x2="0" y2="-148"/>
      <line x1="0" y1="62"  x2="0" y2="148"/>
      <line x1="-62" y1="0" x2="-148" y2="0"/>
      <line x1="62"  y1="0" x2="148" y2="0"/>
      <line x1="-44" y1="-44" x2="-104" y2="-104"/>
      <line x1="44"  y1="-44" x2="104" y2="-104"/>
      <line x1="-44" y1="44"  x2="-104" y2="104"/>
      <line x1="44"  y1="44"  x2="104" y2="104"/>
    </g>
    <!-- 轨道（致敬 Quasar） -->
    <ellipse rx="136" ry="46" fill="none" stroke="#f2cf7e" stroke-width="2.5" opacity="0.8" transform="rotate(-22)"/>
    <!-- 副星（斜向 45°） -->
    <path d="M 0 -58 L 16 -16 L 58 0 L 16 16 L 0 58 L -16 16 L -58 0 L -16 -16 Z"
          fill="#f5c451" opacity="0.85" transform="rotate(45)"/>
    <!-- 主星（四长芒新星） -->
    <path d="M 0 -95 L 24 -24 L 95 0 L 24 24 L 0 95 L -24 24 L -95 0 L -24 -24 Z"
          fill="url(#starGrad)" stroke="#fff3c4" stroke-width="1" filter="url(#glow)"/>
    <!-- 星核 -->
    <circle r="15" fill="#ffffff" filter="url(#glow)"/>
    <!-- 轨道电子 -->
    <circle cx="-117.9" cy="22.9" r="6.5" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- ══ 环形铭文 ══ -->
  <text font-size="20" font-weight="bold" fill="#f2cf7e" letter-spacing="4">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">PYSIDE · NOVA COMPONENT LIBRARY</textPath>
  </text>
  <text font-size="17" font-weight="bold" fill="#d9b45a" letter-spacing="4">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">ENTERPRISE FLAGSHIP EDITION</textPath>
  </text>

  <!-- ══ 旗舰版缎带 ══ -->
  <g filter="url(#soft)">
    <!-- 折角衬片 -->
    <path d="M 146 318 L 112 318 L 124 340 L 112 362 L 146 362 Z" fill="url(#goldDark)"/>
    <path d="M 366 318 L 400 318 L 388 340 L 400 362 L 366 362 Z" fill="url(#goldDark)"/>
    <!-- 折影 -->
    <path d="M 146 362 L 146 372 L 158 362 Z" fill="#5f4312"/>
    <path d="M 366 362 L 366 372 L 354 362 Z" fill="#5f4312"/>
    <!-- 主缎带 -->
    <rect x="146" y="318" width="220" height="44" fill="url(#goldRibbon)"/>
    <rect x="146" y="318" width="220" height="44" fill="none" stroke="#8a5f1d" stroke-width="1"/>
  </g>
  <text x="256" y="349" text-anchor="middle" font-size="26" font-weight="800"
        fill="#14203c" letter-spacing="8">旗舰版</text>
</svg>
