<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 拉丝金属渐变 -->
    <linearGradient id="brushedMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="25%" stop-color="#D1D5DB"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="75%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>

    <!-- 鎏金渐变 -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#FFF8DC"/>
    </linearGradient>

    <!-- 离子青发光 -->
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35E0C8" stop-opacity="1"/>
      <stop offset="60%" stop-color="#1DD6C3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0"/>
    </radialGradient>

    <!-- 星核 3D 切面渐变 -->
    <linearGradient id="starFace1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="starFace2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- 彩带主渐变（深空蓝到星辰蓝） -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1f4d"/>
      <stop offset="50%" stop-color="#1a63ff"/>
      <stop offset="100%" stop-color="#0a1f4d"/>
    </linearGradient>

    <!-- 文字发光滤镜 (简单兼容版) -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect width="512" height="512" fill="#0A0E17" rx="40"/>

  <!-- 2. 六边形拉丝铝底座 -->
  <polygon points="256,36 448,128 448,384 256,476 64,384 64,128"
           fill="url(#brushedMetal)" stroke="#1F2937" stroke-width="4"/>
  <polygon points="256,56 428,140 428,372 256,456 84,372 84,140"
           fill="#0A0E17" stroke="#9CA3AF" stroke-width="2"/>

  <!-- 3. 轨道系统 -->
  <g transform="translate(256, 230) rotate(-25)">
    <ellipse cx="0" cy="0" rx="170" ry="65" fill="none" stroke="url(#goldGradient)" stroke-width="10" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="170" ry="65" fill="none" stroke="#0A0E17" stroke-width="5"/>
    <circle cx="170" cy="0" r="6" fill="#35E0C8" filter="url(#auroraGlow)"/>
  </g>

  <g transform="translate(256, 230) rotate(55)">
    <ellipse cx="0" cy="0" rx="65" ry="170" fill="none" stroke="#1DD6C3" stroke-width="3" opacity="0.6" stroke-dasharray="15 8"/>
    <circle cx="0" cy="-170" r="5" fill="#FFFFFF" />
  </g>

  <!-- 4. 旗舰 3D 星核 -->
  <g transform="translate(256, 230)">
    <circle cx="0" cy="0" r="70" fill="url(#auroraGlow)"/>

    <polygon points="0,-75 -45,0 0,20" fill="url(#starFace1)" stroke="#FFFFFF" stroke-width="1" opacity="0.9"/>
    <polygon points="0,-75 45,0 0,20" fill="url(#starFace2)" stroke="#FFFFFF" stroke-width="1" opacity="0.9"/>
    <polygon points="-45,0 0,20 45,0 0,75" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="1"/>

    <polygon points="0,-35 -18,0 0,10 18,0" fill="#35E0C8" filter="url(#auroraGlow)"/>

    <!-- 8 条 45° 电路射线 -->
    <g stroke="#1DD6C3" stroke-width="2" fill="none" opacity="0.8">
      <path d="M 0,-85 L 0,-105 L 15,-120" />
      <path d="M 85,0 L 105,0 L 120,-15" />
      <path d="M 0,85 L 0,105 L -15,120" />
      <path d="M -85,0 L -105,0 L -120,15" />
      <path d="M 55,-55 L 70,-70 L 70,-85" />
      <path d="M 55,55 L 70,70 L 85,70" />
      <path d="M -55,55 L -70,70 L -70,85" />
      <path d="M -55,-55 L -70,-70 L -85,-70" />
    </g>
    <g fill="#35E0C8" filter="url(#auroraGlow)">
      <circle cx="15" cy="-120" r="3"/>
      <circle cx="120" cy="-15" r="3"/>
      <circle cx="-15" cy="120" r="3"/>
      <circle cx="-120" cy="15" r="3"/>
      <circle cx="70" cy="-85" r="3"/>
      <circle cx="85" cy="70" r="3"/>
      <circle cx="-70" cy="85" r="3"/>
      <circle cx="-85" cy="-70" r="3"/>
    </g>
  </g>

  <!-- 5. 悬浮 3D Nova 彩带 (下部，微倾斜) -->
  <g transform="translate(256, 380) rotate(-4)">
    <!-- 彩带阴影（3D厚度） -->
    <path d="M -160,-25 L 160,-25 C 180,-25 180,-5 160,-5 L -160,-5 C -180,-5 -180,-25 -160,-25 Z" fill="#000000" opacity="0.6" transform="translate(0, 10)" />

    <!-- 彩带主体（带弧形折角） -->
    <path d="M -160,-25 L 160,-25 C 175,-25 185,-15 185,0 C 185,15 175,25 160,25 L -160,25 C -175,25 -185,15 -185,0 C -185,-15 -175,-25 -160,-25 Z"
          fill="url(#ribbonGrad)" stroke="url(#goldGradient)" stroke-width="3"/>

    <!-- 彩带内高光（增加立体感） -->
    <path d="M -155,-20 L 155,-20 C 165,-20 170,-12 170,0 C 170,12 165,20 155,20 L -155,20 C -165,20 -170,12 -170,0 C -170,-12 -165,-20 -155,-20 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>

    <!-- 文字：Nova -->
    <text x="0" y="12" font-family="'Arial Black', Impact, sans-serif" font-size="32" font-weight="900"
          fill="#35E0C8" text-anchor="middle" letter-spacing="4" filter="url(#textGlow)">
      Nova
    </text>
  </g>
</svg>