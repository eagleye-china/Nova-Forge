# .github/workflows/publish.yml

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # ✅ 与 push 同级，支持在 GitHub Actions 页面手动触发

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # ✅ 必须，用于 OIDC 免密发布

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build package
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1