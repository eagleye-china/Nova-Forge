name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # 当推送 v0.1.0 这样的 Tag 时触发

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi  # ✅ 对应你在 PyPI 页面填写的环境名
    permissions:
      id-token: write  # ✅ 核心权限，用于获取 OIDC 令牌
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build package
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1